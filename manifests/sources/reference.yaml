- id: nemotron_legal_v1
  label: Selected Nemotron synthetic legal reasoning
  category: reference
  phase_tokens: {phase_a: 2240409567, phase_b: 0, phase_c: 0}
  provenance: {generated: true, transformed: true, fresh: false}
    # Five of the thirteen subsets are reformulations of tasks from benchmarks
    # this build evaluates on -- manifests/contamination/eval-holdouts.yaml pins
    # both nguha/legalbench and coastalcph/lex_glue, and lex_glue carries
    # case_hold. Decontamination is not a reliable backstop for them: the policy
    # matches on 13-grams, and these rows are Qwen3 reformulations that need
    # share no 13-gram with the benchmark text they came from. Excluding them at
    # the pin is the defence that actually holds.
    #
    # Read the payloads, not the directory names: the two largest subsets are
    # swapped. `Case-Law-Summary/` holds the CaseHOLD task verbatim ("select the
    # correct holding statement from the options", models_used Qwen3) and is
    # excluded; `CaseHOLD/` holds ordinary case-law narrative ("United States v.
    # Daniel Dee Veon...", models_used none) and is kept. Keeping the directory
    # named CaseHOLD and dropping the one named Case-Law-Summary is correct and
    # is the opposite of what the names suggest.
    #
    # Excluded: Case-Law-Summary (CaseHOLD task), LegalBench-CUAD-v2,
    # Definition-Classification, Function-Of-Decision, Diversity-Jurisdiction
    # -- the last four are LegalBench task names. ToSDR/ToS/eCFR-QA are
    # question-shaped but derive from tosdr.org and the eCFR, neither of which
    # is a pinned benchmark, so they stay.
  access:
    type: huggingface
    repo_id: nvidia/Nemotron-Pretraining-Legal-v1
    revision: 3d91d58a5c0c46fe9944300ec46719f97a385b13
    gated: false
    allow_patterns:
    - 'Nemotron-Pretraining-Legal-California-Code-Of-Regulations/*.parquet'
    - 'Nemotron-Pretraining-Legal-CaseHOLD/*.parquet'
    - 'Nemotron-Pretraining-Legal-GlobalCit/*.parquet'
    - 'Nemotron-Pretraining-Legal-NYCourts-Judicial-Ethics-Opinions/*.parquet'
    - 'Nemotron-Pretraining-Legal-ToS-Clause-Understanding/*.parquet'
    - 'Nemotron-Pretraining-Legal-ToSDR-QA/*.parquet'
    - 'Nemotron-Pretraining-Legal-eCFR/*.parquet'
    - 'Nemotron-Pretraining-Legal-eCFR-QA/*.parquet'
  license: {status: reviewed, expression: CC-BY-4.0}
  acquisition: {driver: hf_snapshot, candidate_multiplier: 2.74, compressed_bytes_per_token: 0.75}
  processing: {quality_profile: legal_synthetic_v1, dedup_namespace: synthetic_legal, priority: 75}

- id: metis_govreference_uk_hansard
  label: Common Pile filtered official United Kingdom parliamentary record
  category: reference
  phase_tokens: {phase_a: 1197897925, phase_b: 0, phase_c: 0}
  provenance: {generated: false, transformed: false, fresh: false}
  access:
    type: huggingface
    repo_id: common-pile/uk_hansard_filtered
    revision: c88adc44309aa255a41b51cef93ba783f775fe23
    gated: false
    allow_patterns: [uk_hansard-*.json.gz]
    take_all: true
  license: {status: reviewed, expression: Open-Parliament-Licence}
    # official_docs_v1 requires a canonical source URL. The Hansard records
    # carry an id, a year, and the publication they came from, but no per-row
    # URL, so every record was rejected for not restating an origin that is
    # fixed for the whole corpus.
  attestation_basis: >-
    This is a pinned snapshot of the official UK Parliament Hansard record,
    whose canonical publication is hansard.parliament.uk. The canonical origin
    is a property of the publication, identical for every row; each record's
    own id and sitting date locate it within that publication.
  attestations:
    canonical_url: https://hansard.parliament.uk/
  acquisition: {driver: hf_snapshot, candidate_multiplier: 3.25, compressed_bytes_per_token: 1.28}
  processing: {quality_profile: official_docs_v1, dedup_namespace: global_reference, priority: 90}

