  - id: pes2o
    label: peS2o open scientific papers
    category: science
    phase_tokens: {phase_a: 22000000000, phase_b: 7000000000, phase_c: 1000000000}
    provenance: {generated: false, transformed: false, fresh: false}
    # peS2o v2 is the publisher-recommended release at this pinned revision.
    # Its training shards use .json.gz (not .jsonl.gz).
    access: {type: huggingface, repo_id: allenai/peS2o, revision: 636a503e44a3ca1b58e01fb61eab0825cd574de0, gated: false, allow_patterns: ['data/v2/train-*.json.gz']}
    # Was per_record_required/per-paper-license. The v2 training shards carry
    # no per-paper licence field, so every record would have been rejected --
    # caught by sampling rather than by waiting for its tasks to run. AI2
    # releases peS2o under ODC-By; the S2ORC papers behind it keep their own
    # terms, which this expression does not and cannot enumerate.
    license: {status: reviewed, expression: ODC-By-1.0}
    acquisition: {driver: hf_snapshot, candidate_multiplier: 4.67, compressed_bytes_per_token: 0.70}
    processing: {quality_profile: scientific_paper_v1, dedup_namespace: global_science, priority: 92}

