  - id: proof_pile2_science
    label: Proof-Pile-2 science subset
    category: science
    phase_tokens: {phase_a: 4000000000, phase_b: 1000000000, phase_c: 0}
    provenance: {generated: false, transformed: false, fresh: false}
    # The repo holds three corpora: algebraic-stack (code and formal proofs),
    # arxiv (papers), open-web-math. '**/*.jsonl.zst' took all three, and the
    # resolver filled this source with AlgebraicStack code -- agda-test,
    # isa_proofsteps, fortran0003, jupyter-notebook0000 -- graded by a
    # scientific-paper profile, hence 20%. It also gave proof_pile2_math the
    # identical 482-file set: all 48 of this source's files were also that
    # source's. open-web-math is excluded because openwebmath_unique already
    # pins that same corpus standalone. test/ and validation/ are the
    # publisher's held-out splits and cost only 266MB to leave behind.
    #
    # The licence status moves with the pattern and must not be separated from
    # it. arXiv rows carry no per-record licence -- their meta keys are exactly
    # {arxiv_id, language, timestamp, url, yymm} -- so under
    # `per_record_required` stage_runner rejects every row as missing_license
    # BEFORE the quality profile runs, measured 0/180. Today's 20% survives only
    # because AlgebraicStack ships max_stars_repo_licenses. Re-pinning without
    # this line is a 20% -> 0% regression.
    access: {type: huggingface, repo_id: EleutherAI/proof-pile-2, revision: 901a9273a770e9d4138c5ddd91802f9c5c6cdc4b, gated: false, allow_patterns: ['arxiv/train/*.jsonl.zst']}
    license: {status: reviewed, expression: arxiv-mixed-per-paper}
    acquisition: {driver: hf_snapshot, candidate_multiplier: 4.67, compressed_bytes_per_token: 0.65}
    processing: {quality_profile: scientific_paper_v1, dedup_namespace: global_math_science, priority: 84}

  - id: openstax
    label: Historical CC-BY OpenStax textbook snapshot
    category: science
    phase_tokens: {phase_a: 29250000, phase_b: 9750000, phase_c: 0}
    provenance: {generated: false, transformed: false, fresh: false}
    access:
      type: huggingface
      repo_id: crumb/openstax-text
      revision: 8f502ca45f9f05cb5673eae445b7a97a4e8c4349
      gated: false
      allow_patterns: [data/*.txt]
      take_all: true
    # Was per_record_required with per-book verification from the attribution
    # page inside each book's text. That check works -- 69 of 76 books carry the
    # statement -- but the 7 without one yield zero accepted records, and a
    # zero-yield file fails its whole normalization task, stopping the build.
    #
    # Operator decision, 2026-08-02. OpenStax publishes all textbook content
    # under CC BY 4.0 and the dataset card declares cc-by-4.0, so the corpus-
    # level statement is true of every book including the 7. The in-book check
    # in normalization_evidence.py is left in place: where the statement is
    # present it is still recorded as the stronger per-book evidence.
    license: {status: reviewed, expression: CC-BY-4.0}
    acquisition: {driver: hf_snapshot, candidate_multiplier: 2.03, compressed_bytes_per_token: 4.00}
    processing: {quality_profile: textbook_v1, dedup_namespace: global_science_reference, priority: 96}

  # metis_freshscience_2025_26 (10B: 6/3/1) and metis_freshdocs_2025_26
  # (10B: 5/4/1) were withdrawn with the other two common_crawl_ranges sources.
  # Eleven days on the acquisition host produced 184KiB of documents across all
  # four against a 90B token target, while their SQLite ledgers grew to 1.5TiB;
  # that host is a login node whose ledger sits on Lustre with no node-local
  # scratch, so its random-order inserts are network round trips. Their 20B
  # moves to the three largest science corpora below, all already on disk. The
  # science category total is unchanged at 125B and every per-phase total is
  # exact. See manifests/sources/web.yaml for the full account.

