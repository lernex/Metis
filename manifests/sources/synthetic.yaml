    # Fact-seeking rows are short question-and-answer pairs generated from a
    # prompt, not from a grounding document, so grounded_synthetic_v1 asked two
    # things of them that are not true: a source document they never had, and a
    # 200-character floor that most correct answers fall below.
  processing: {quality_profile: synthetic_qa_v1, dedup_namespace: synthetic_grounded, priority: 96}

