  # Was metis_freshweb_2026: a common_crawl_ranges build over the five 2026
  # crawls. All four common_crawl_ranges sources were withdrawn after eleven
  # days on the acquisition host produced 184KiB of documents against a 90B
  # token target while accumulating 1.5TiB of SQLite ledger. That host is a
  # login node -- the only one with egress -- whose ledger lives on Lustre with
  # no node-local scratch, so the ledger's random-order inserts are network
  # round trips and the working set never fits its cache. The route is sound;
  # the host cannot run it. See docs/metis16_operator_runbook.md.
  #
  # FineWeb ships the same thing already built: Common Crawl, extracted,
  # filtered, deduplicated, as parquet on the path that moved 1.4TiB here
  # without incident. Its newest dumps are CC-MAIN-2025-21 and CC-MAIN-2025-26,
  # so the freshness window narrows from 2026-06 to 2025-06 and the corpus is
  # honestly a year less current than planned -- but it is real 2025 web text
  # rather than the nothing the crawler delivered. The 2026 crawls are a 1.7
  # target, on a host with egress from compute and local scratch for the ledger.
- id: metis_freshweb_2025
  label: Current general web and recent knowledge through CC-MAIN-2025-26
  category: web
  phase_tokens: {phase_a: 27001494303, phase_b: 5464588132, phase_c: 1717106313}
    # common_crawl_derived keeps the final publisher opt-out re-check on this
    # source. FineWeb is Common Crawl text filtered by a third party in
    # 2025-07, so anyone who withdrew since is still in it; the re-check used
    # to be gated on the common_crawl_ranges driver, which this no longer is.
  provenance:
    generated: false
    transformed: false
    fresh: true
    freshness_bucket: general_web
    common_crawl_derived: true
  access:
    type: huggingface
    repo_id: HuggingFaceFW/fineweb
    revision: 9bb295ddab0e05d785b879661af7260fed5140fc
    gated: false
    allow_patterns: [data/CC-MAIN-2025-21/*.parquet, data/CC-MAIN-2025-26/*.parquet]
      # Cold reserve: the four older 2025 dumps, held back so a shortfall widens
      # the window backwards inside 2025 instead of falling out of the freshness
      # bucket entirely. Nothing before CC-MAIN-2025-05 is eligible -- FineWeb's
      # 2024 dumps would satisfy the token count while destroying the property
      # this source exists for.
    reserve_allow_patterns: [data/CC-MAIN-2025-18/*.parquet, data/CC-MAIN-2025-13/*.parquet, data/CC-MAIN-2025-08/*.parquet, data/CC-MAIN-2025-05/*.parquet]
    cutoff_start: '2025-01-01'
    cutoff_end: '2025-06-30'
  license: {status: reviewed, expression: ODC-By-1.0}
  acquisition: {driver: hf_snapshot, candidate_multiplier: 3.04, compressed_bytes_per_token: 1.10}
  processing: {quality_profile: fresh_web_2026_v1, dedup_namespace: global_web, priority: 100}

