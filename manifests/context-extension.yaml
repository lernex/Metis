- {id: nemotron_cc_v21_organic, domain: educational_web, tokens: 500000000, retrieval_multiplier: 2.5}
- {id: fineweb_edu, domain: educational_web, tokens: 300000000, retrieval_multiplier: 2.5}
- {id: essential_web, domain: educational_web, tokens: 100000000, retrieval_multiplier: 2.5}
