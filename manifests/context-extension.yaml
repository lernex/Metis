- {id: metis_freshweb_2025, domain: general_reference, tokens: 300000000, retrieval_multiplier: 2.5}
fallbacks:
  exhaustion_policy: fail_closed
  preserve_domain: true
  generated_donor_forbidden: true
  groups:
  - id: repository_code
    members:
    - starcoder_permissive_code
    - nemotron_cc_code_v1
    - github_code_clean
    donor_order:
    - starcoder_permissive_code
    - nemotron_cc_code_v1
    - github_code_clean
